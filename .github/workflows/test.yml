name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  specification-tests:
    name: Specification Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r docker/ci/requirements.txt

      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript

      - name: Run test suite
        env:
          CONFORMANCE_REPORT: conformance-report.json
        run: bash scripts/test.sh

      - name: Summarize conformance report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/conformance_summary.py conformance-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: warn

  determinism-windows:
    name: Determinism (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r docker/ci/requirements.txt

      - name: Install Ghostscript
        run: choco install --no-progress -y ghostscript

      - name: Locate Ghostscript
        shell: bash
        run: |
          set -euo pipefail
          executable="$(find "C:/Program Files/gs" -name gswin64c.exe -print -quit)"
          if [[ -z "${executable}" ]]; then
            echo "the Ghostscript install carries no gswin64c.exe" >&2
            exit 1
          fi
          echo "OPENLABEL_GS=${executable}" >> "${GITHUB_ENV}"

      - name: Run the golden and determinism cases
        shell: bash
        run: |
          set -euo pipefail
          python tests/conformance/runner.py --filter RO-111 | tee conformance-determinism-windows.txt
          python tests/conformance/runner.py --filter DT | tee -a conformance-determinism-windows.txt

      - name: Summarize the determinism run
        if: always()
        shell: bash
        run: |
          if [[ -f conformance-determinism-windows.txt ]]; then
            cat conformance-determinism-windows.txt >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload the determinism report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-determinism-windows
          path: conformance-determinism-windows.txt
          if-no-files-found: warn

  docker-stub-build:
    name: Docker Stub Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Dockerfile
          push: false
          tags: openlabelserver/ci:test

      - name: Build service stub images
        run: |
          docker compose -f docker/docker-compose.yml build backend frontend renderer printing

      - name: Verify stub health endpoints
        run: |
          docker compose -f docker/docker-compose.yml up -d backend renderer printing
          for port in 8000 8001; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/health" >/dev/null; then
                echo "Health check passed on port ${port}"
                break
              fi
              if [[ "${attempt}" -eq 30 ]]; then
                echo "Timed out waiting for port ${port}" >&2
                docker compose -f docker/docker-compose.yml logs
                exit 1
              fi
              sleep 2
            done
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8001/health
          docker compose -f docker/docker-compose.yml down
